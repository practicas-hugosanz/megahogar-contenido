name: Publicar el panel

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build-site.mjs"
      - "megahogar-reels/publish/queue.json"
      - "megahogar-directo/renders/*.mp4"
      - ".github/workflows/panel.yml"
  schedule:
    - cron: "20 * * * *" # se refresca cada hora (tras publicar, el estado cambia)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
