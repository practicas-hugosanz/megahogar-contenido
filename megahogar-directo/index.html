<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1f2d5f;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Oswald", sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        --navy: #1f2d5f;
        --orange: #e8541e;
        --sky: #bfcfff;
      }
      .beat {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .b1 {
        background: #111;
        color: #fff;
        z-index: 1;
      }
      .b2 {
        background: var(--navy);
        color: #fff;
        z-index: 2;
        clip-path: inset(0 0 100% 0);
      }
      .b3 {
        background: #fff;
        color: var(--navy);
        z-index: 3;
        clip-path: inset(0 100% 0 0);
      }
      .b4 {
        background: var(--sky);
        color: var(--navy);
        z-index: 4;
        clip-path: inset(100% 0 0 0);
      }
      .b5 {
        background: var(--navy);
        color: #fff;
        z-index: 5;
        clip-path: inset(0 0 0 100%);
      }
      .vid {
        position: absolute;
        object-fit: cover;
      }
      .full {
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.5) 100%);
      }
      .inset {
        position: absolute;
        left: 70px;
        top: 1010px;
        width: 940px;
        height: 560px;
        border-radius: 44px;
        overflow: hidden;
        box-shadow: 0 18px 0 0 rgba(31, 45, 95, 0.25);
      }
      .inset .vid {
        left: 0;
        top: 0;
        width: 940px;
        height: 560px;
      }
      .line {
        position: absolute;
        left: 70px;
        width: 940px;
        line-height: 0.98;
      }
      .w {
        display: inline-block;
        margin-right: 0.22em;
        transform-origin: left bottom;
      }
      .tag {
        position: absolute;
        left: 70px;
        background: var(--orange);
        color: #fff;
        font-size: 64px;
        line-height: 1;
        padding: 14px 30px 12px;
        transform: rotate(-4deg);
        transform-origin: left center;
      }
      .small {
        font-weight: 400;
        text-transform: none;
        line-height: 1.15;
      }
      .strike-wrap {
        position: relative;
        display: inline-block;
      }
      .strike {
        position: absolute;
        left: -10px;
        top: 52%;
        height: 14px;
        width: 0;
        background: var(--orange);
        border-radius: 8px;
      }
      .hl {
        position: relative;
        display: inline-block;
        isolation: isolate;
      }
      .hl::before {
        content: "";
        position: absolute;
        left: -14px;
        right: -14px;
        top: 18%;
        bottom: 6%;
        background: var(--orange);
        z-index: -1;
        transform: scaleX(var(--hl, 0)) rotate(-1.2deg);
        transform-origin: left center;
      }
      #hlword {
        color: #fff;
      }
      .handle {
        position: absolute;
        left: 70px;
        background: #fff;
        color: var(--orange);
        font-size: 100px;
        line-height: 1.1;
        padding: 6px 34px 4px;
        text-transform: none;
        transform: rotate(-3deg);
        transform-origin: left center;
      }
      #logo {
        position: absolute;
        left: 70px;
        width: 440px;
      }
      .shadowtxt {
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13.5" data-width="1080" data-height="1920">
      <div class="beat b1" id="beat1"><video id="v-hook" class="vid full" src="assets/stock/pexels-7292490.mp4" muted playsinline data-start="0" data-duration="3.60" data-media-start="2.0" data-track-index="0"></video><div class="shade"></div><div class="line shadowtxt" style="top:880px;font-size:135px;line-height:1.08"><span class="w">¿Aclaras</span><span class="w">los</span><span class="w">platos</span><span class="w">antes</span><span class="w">de</span><span class="w">meterlos</span><span class="w">en</span><span class="w">el</span><span class="w">lavavajillas?</span></div></div>

      <div class="beat b3" id="beat3"><div class="small line" id="b3r1" style="top:250px;font-size:76px;font-weight:400">Solo quita</div><div class="line" id="b3r2" style="top:351px;font-size:165px"><span class="w">los</span><span class="w">restos</span></div><div class="line" id="b3r3" style="top:530px;font-size:165px"><span class="hl" id="b3r3h"><span class="hlword"><span class="w">grandes.</span></span></span></div><div class="small line" id="b3r4" style="top:709px;font-size:76px;font-weight:400">Y listo.</div><div class="inset" id="inset-b3"><video id="v-b3" class="vid" src="assets/stock/pexels-9474125.mp4" muted playsinline data-start="5.40" data-duration="2.55" data-media-start="1.0" data-track-index="0"></video></div></div>
      <div class="beat b4" id="beat4"><div class="small line" id="b4r1" style="top:250px;font-size:76px;font-weight:400">Y...</div><div class="line" id="b4r2" style="top:351px;font-size:170px"><span class="w">limpia</span><span class="w">el</span><span class="w">filtro</span></div><div class="line" id="b4r3" style="top:702px;font-size:130px;color:var(--navy)"><span class="w">con</span><span class="w">regularidad.</span></div><div class="inset" id="inset-b4"><video id="v-b4" class="vid" src="assets/stock/pexels-9462909.mp4" muted playsinline data-start="7.65" data-duration="2.50" data-media-start="1.0" data-track-index="0"></video></div></div>

      <audio id="vo" src="audio/lavavajillas.mp3" data-start="0" data-track-index="1" data-volume="1"></audio><audio id="sfx0" src="assets/sfx/whoosh-short.mp3" data-start="3.05" data-duration="0.57" data-track-index="2" data-volume="0.45"></audio><audio id="sfx1" src="assets/sfx/impact-bass-1.mp3" data-start="4.15" data-duration="2.1" data-track-index="3" data-volume="0.4"></audio><audio id="sfx2" src="assets/sfx/whoosh-short.mp3" data-start="5.15" data-duration="0.57" data-track-index="4" data-volume="0.45"></audio><audio id="sfx3" src="assets/sfx/whoosh-short.mp3" data-start="7.40" data-duration="0.57" data-track-index="5" data-volume="0.45"></audio><audio id="sfx4" src="assets/sfx/whoosh-short.mp3" data-start="9.60" data-duration="0.57" data-track-index="6" data-volume="0.45"></audio><audio id="sfx5" src="assets/sfx/sparkle.mp3" data-start="11.40" data-duration="1.7" data-track-index="7" data-volume="0.4"></audio>
    </div>
    <script>

      tl.from(hw[0], { y: 120, opacity: 0, rotation: 5, duration: 0.3, ease: "back.out(2)" }, 0.0);

      tl.from("#b4r3 .w", { y: 130, opacity: 0, duration: 0.3, ease: "back.out(2)", stagger: 0.15 }, 8.8);

      tl.set("#beat4", { visibility: "hidden" }, 10.15);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
